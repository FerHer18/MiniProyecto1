<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MagicSwapp</title>
     <link rel="icon" type="image/png" href="imagenes/logoCircular.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="ConfiguracionesSorteo.css">
  </head>
  <body> 
    <nav class="navbar navbar-expand-lg sticky-top shadow navbar-dark">
        <div class="container">
            <a href="#hero" class="navbar-brand fw-bold">MagicSwapp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="configuraciones-section d-flex align-items-center p-4">
        <div class="container p-4 config-card shadow">
            <div class="mt-4" id="configuracionEvento">
                    <label class="form-label fw-bold">¿Para qué vas a sortear nombres?</label>
                    <div class="d-flex flex-wrap gap-2 mt-3" id="opcionesSorteo">
                        <button type="button" class="btn opcion">
                            Día de San Valentín
                        </button>

                        <button type="button" class="btn opcion">
                            Intercambio
                        </button>

                        <button type="button" class="btn opcion">
                            Navidad
                        </button>

                        <button type="button" class="btn opcion">
                            Día del Niño
                        </button>

                        <button type="button" class="btn opcion">
                            Día de la Madre
                        </button>

                        <button type="button" class="btn opcion">
                            Mostrar más
                        </button>
                    </div>

                    <div id="masOpciones" class="mt-3 d-none">
                        <input type="text" class="form-control" id="eventoPersonalizado" placeholder="Nombre de la celebración">
                    </div>
                </div>
                
                <!-- CONFIGURACION DE FECHA -->
                <div class="mt-4" id="configuracionFecha">
                    <label class="form-label mt-3 fw-bold">¿Cuándo será el intercambio?</label>

                    <div class="d-flex flex-wrap gap-2 mt-2" id="opcionesFecha">
                        <div id="fechasSugeridas" class="d-flex flex-wrap gap-2"></div>
                        <button type="button" class="btn opcion-fecha">Otro</button>
                    </div>

                    <div id="fechaPersonalizada" class="mt-3 d-none">
                        <input type="date" class="form-control" id="fechaSorteo">
                    </div>

                    <div class="form-text">La fecha del sorteo no puede ser anterior a hoy.</div>
                    <button type="button" class="btn btn-secondary mt-2 d-none" id="fechaHoyBtn">Día siguiente</button>
                </div>

                <!-- CONFIGURACION DE PRECIO-->
                <div class="mt-4" id="configuracionPrecio">
                    <label class="form-label fw-bold">¿Precio del regalo?</label>

                    <div class="d-flex flex-wrap gap-2 mt-2" id="preciosSugeridos"></div>

                    <button type="button" class="btn opcion-precio mt-1" id="otroPrecio">Otro</button>

                    <div id="precioPersonalizado" class="mt-3 d-none">
                        <input type="number" class="form-control" id="precioMaximo" placeholder="Ingresa el precio máximo">
                    </div>

                    <div class="form-text">Si no deseas establecer un precio máximo, deja este campo en blanco</div>
                    
                </div>
                <div class="mt-4 text-center">
                    <button type="button" class="btn btn-primary px-4" id="continuarBtn" disabled>Finalizar</button>
                </div>
        </div>
    </section>

    <footer class="text-white text-center py-3 sticky-bottom">
        <div class="container">
            <p class="mb-1">© MagicSwapp 2026. Todos los derechos reservados.</p>
            <p class="mb-1">Valeria Bernal Salcedo y Fernando Gabriel Hernández Junco</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="Configuraciones.js"></script>
</body>
</html>
